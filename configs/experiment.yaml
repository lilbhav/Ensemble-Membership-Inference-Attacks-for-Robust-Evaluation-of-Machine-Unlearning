# Central experiment config used by scripts/* pipeline entrypoints.

paths:
  # Third-party engines invoked by bridge scripts.
  machine_unlearning_repo: Third_Party_Code/MachineUnlearning
  mia_disparity_repo: Third_Party_Code/mia-disparity

  # Colab/Drive defaults; override these for local runs if needed.
  data_root: /content/drive/MyDrive/unlearning_runs/data
  results_root: /content/drive/MyDrive/unlearning_runs/results


experiment:
  datasets: [Cifar10]
  base_model: ResNet18
  base_seeds: [0]
  device: cuda

split:
  # Supported value: targeted_random
  split_mode: targeted_random

  # Forget examples are sampled only from this class.
  target_class: 0

  # Exactly one of forget_fraction or forget_count must be set.
  # This run uses a fixed forget count for stronger and more stable signal.
  forget_fraction: null
  forget_count: 500

training:
  baseline:
    epochs: 100
    batch_size: 128
    lr: 0.1
    optimizer: sgd
    momentum: 0.9
    weight_decay: 0.0005
    lr_scheduler: cosine

  unlearning:
    # Global defaults aligned to the seed-0 SSD reference run.
    epochs: 1
    batch_size: 64
    lr: 0.0001
    optimizer: adam
    momentum: 0.5

    # Optional sweep presets for SCRUB experiments.
    scrub_sweep:
      - name: scrub_default
      - name: scrub_stronger_forgetting
        epochs: 10
        lr: 0.0005
        distill_weight: 0.05
        forget_loss_weight: 0.7
        maximize_epochs: 4
        maximize_steps: 2
        minimize_steps: 1
      - name: scrub_balanced
        epochs: 8
        lr: 0.0004
        distill_weight: 0.08
        forget_loss_weight: 0.5
        maximize_epochs: 3
        maximize_steps: 2
        minimize_steps: 2

    # Method-specific parameters passed to bridge + third-party implementations.
    methods:
      scrub:
        # teacher_loaded: start SCRUB teacher from baseline checkpoint.
        # random_init: initialize teacher from scratch.
        mode: teacher_loaded
        epochs: 20
        lr: 0.0007
        gamma: 0.985
        distill_weight: 0.03
        forget_loss_weight: 1.2
        maximize_epochs: 8
        maximize_steps: 3
        minimize_steps: 1
        post_maximize_repair_scale: 0.6
        kd_temperature: 4.0
        weight_decay: 0
        momentum: 0.9
        lr_decay_epochs: [12, 16]
        lr_decay_rate: 0.3

      ssd:
        # Seed-0 SSD reference hyperparameters.
        selection_weighting: 20
        dampening_constant: 10
        lower_bound: 1
        exponent: 1
        min_layer: -1
        max_layer: -1
        forget_threshold: 1
        # Disable wrapper-side retain repair to match the original reference run.
        post_repair_epochs: 0

      bad_teacher:
        # epochs: number of distillation passes — primary driver of forgetting.
        epochs: 30
        # kl_temperature: softer distributions from higher T make distillation smoother.
        kl_temperature: 5.0
        # retain_subset_fraction: fraction of retain set used per epoch.
        retain_subset_fraction: 0.25

      # Uses framework/global defaults unless method config is extended.
      amnesiac: 
        epochs: 5

# Which unlearning methods to run in scripts/run_unlearning.py and downstream steps.
unlearning:
  methods: [amnesiac, bad_teacher, scrub, ssd]


mia:
  # Attack names must match bridge-supported attack aliases/implementations.
  attacks: [yeom, shokri, lira, reference, losstraj, calibration, aug]
  attack_seeds: [0]
  attack_epochs: 20
  target_fpr: 0.05
  num_shadow_models: 5
  batch_size: 256
  targets: [forget_vs_test]


ensemble:
  voting_rules:
    or: true
    k_of_m: [2, 3]
  positive_label_threshold: 0.5
