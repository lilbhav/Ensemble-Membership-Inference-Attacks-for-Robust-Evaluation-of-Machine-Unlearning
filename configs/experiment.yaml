experiment:
  name: "mia_disparity_cifar10"
  seed: 42
  device: "cuda"

dataset:
  name: "cifar10"
  data_root: "/content/data/raw"
  split_dir: "/content/gdrive/My Drive/mia_splits/shared_targeted_random"
  forget_fraction: 0.2
  retain_fraction: 0.8
  num_classes: 10

model:
  architecture: "resnet18"
  pretrained: false

unlearning:
  params:
    split_protocol: "targeted_random"
    forget_class: 3  # 0=airplane 1=automobile 2=bird 3=cat 4=deer 5=dog 6=frog 7=horse 8=ship 9=truck
    # Data protocol — must match the split used during SCRUB/SSD unlearning.
    # Retain: 100/class x 9 classes = 900 | Left-out: 25/class x 9 classes = 225
    retain_count: 900
    forget_count: 100
    left_out_count: 225

models_to_evaluate:
  - name: "scrub"
    model_type: "unlearned"
    unlearning_method: "scrub"
    checkpoint_path: "/content/gdrive/My Drive/mia_checkpoints/scrub_unlearned_model.pt"

  - name: "ssd"
    model_type: "unlearned"
    unlearning_method: "ssd"
    checkpoint_path: "/content/gdrive/My Drive/mia_checkpoints/ssd_unlearned_model.pt"

  - name: "bad_teacher"
    model_type: "unlearned"
    unlearning_method: "bad_teacher"
    checkpoint_path: "/content/gdrive/My Drive/mia_checkpoints/bad_teacher_unlearned_model.pt"

  - name: "amnesiac"
    model_type: "unlearned"
    unlearning_method: "amnesiac"
    checkpoint_path: "/content/gdrive/My Drive/mia_checkpoints/amnesiac_unlearned_model.pt"

mia:
  evaluation_targets:
    - "forget_vs_test"
    - "retain_vs_test"
    - "forget_vs_retain"

  ensembles:
    enabled: true
    methods:
      - "union"
      - "voting"
      - "average_score"
    k: 2

  attacks:
    - name: "yeom"
      params:
        batch_size: 128

    - name: "shokri"
      params:
        num_shadow_models: 10
        epochs: 50

    - name: "lira"
      params:
        num_shadow_models: 16

    - name: "calibration"
      params:
        num_shadow_models: 4
        num_shadow_epochs: 20
        batch_size: 128
        lr: 0.01

    - name: "reference"
      params:
        num_shadow_models: 29

    - name: "augmentation"
      params:
        batch_size: 64
        num_augmentations: 2

output:
  save_dir: "/content/gdrive/My Drive/mia_results/shared_multi_model"
  log_dir: "/content/gdrive/My Drive/mia_results/logs"
