paths:
  machine_unlearning_repo: Third_Party_Code/MachineUnlearning
  mia_disparity_repo: Third_Party_Code/mia-disparity
  data_root: /content/drive/MyDrive/unlearning_runs/data
  results_root: /content/drive/MyDrive/unlearning_runs/results

experiment:
  datasets: [Cifar10, Cifar100]
  base_model: ResNet18
  base_seeds: [0]
  device: cuda

split:
  split_mode: targeted_random
  target_class: 0
  forget_fraction: 0.1  # Fraction within the selected target_class, not the full training set.
  forget_count: null

training:
  baseline:
    epochs: 100
    batch_size: 128
    lr: 0.1
    optimizer: sgd
    momentum: 0.9
    weight_decay: 0.0005
    lr_scheduler: cosine
  unlearning:
    epochs: 1
    batch_size: 64
    lr: 0.0001
    optimizer: adam
    momentum: 0.5
    scrub_sweep:
      - name: scrub_default
      - name: scrub_stronger_forgetting
        epochs: 10
        lr: 0.0005
        distill_weight: 0.05
        forget_loss_weight: 0.7
        maximize_epochs: 4
        maximize_steps: 2
        minimize_steps: 1
      - name: scrub_balanced
        epochs: 8
        lr: 0.0004
        distill_weight: 0.08
        forget_loss_weight: 0.5
        maximize_epochs: 3
        maximize_steps: 2
        minimize_steps: 2
    methods:
      scrub:
        mode: teacher_loaded
        epochs: 12
        lr: 0.00045
        gamma: 0.985
        distill_weight: 0.03
        forget_loss_weight: 1.15
        maximize_epochs: 6
        maximize_steps: 3
        minimize_steps: 1
        kd_temperature: 4.0
        weight_decay: 0
        momentum: 0.9
        lr_decay_epochs: [8, 10]
        lr_decay_rate: 0.3
      ssd:
        # selection_weighting (α): selects synapses where forget_importance > α × retain_importance.
        # Higher = more selective (fewer synapses modified). Default 10.
        selection_weighting: 20
        # dampening_constant (λ): each selected synapse is multiplied by (λ × oimp / fimp).
        # Higher = less aggressive per synapse. Default 1 → weights oimp/fimp (<0.1 for selected).
        # 5 → max 50% reduction at boundary; 10 → zero net change at boundary.
        dampening_constant: 10
        # Keep remaining SSD parameters at their defaults.
        lower_bound: 1
        exponent: 1
        min_layer: -1
        max_layer: -1
        forget_threshold: 1
      bad_teacher:
        # epochs: number of distillation passes — primary driver of forgetting.
        epochs: 5
        # kl_temperature: softer distributions from higher T make distillation smoother.
        kl_temperature: 4.0
        # retain_subset_fraction: fraction of retain set used per epoch.
        retain_subset_fraction: 0.3
      amnesiac: {}

unlearning:
  methods: [scrub]

mia:
  attacks: [yeom, shokri, lira, reference, losstraj, calibration, aug]
  attack_seeds: [0]
  attack_epochs: 20
  num_shadow_models: 5
  batch_size: 256
  targets: [forget_vs_test, retain_vs_test, forget_vs_retain]

ensemble:
  voting_rules:
    or: true
    k_of_m: [2, 3]
  positive_label_threshold: 0.5
