experiment:
  name: "mia_disparity_cifar10"
  seed: 42
  device: "cuda"

dataset:
  name: "cifar10"
  data_root: "./data"
  split_dir: "./data/splits"
  forget_fraction: 0.2
  retain_fraction: 0.8
  num_classes: 10

model:
  architecture: "resnet18"
  pretrained: false
  checkpoint_path: "./checkpoints/full_model.pt"

unlearning:
  method: "ssd"   # [fine_tune, grad_ascent, scrub, ssd]
  checkpoint_path: "/content/gdrive/My Drive/mia_checkpoints/ssd_unlearned_model.pt"
  params:
    # Random-sample unlearning preset (SSD)
    lr: 0.1
    dampening_constant: 0.47
    selection_weighting: 1.65
    lower_bound: 1.0
    exponent: 1.0
    forget_threshold: 1.0

  # method: "scrub"
  # checkpoint_path: "/content/gdrive/My Drive/mia_checkpoints/scrub_unlearned_model.pt"
  # params:
  #   epochs: 3
  #   lr: 0.0005
  #   weight_decay: 0.0005
  #   temperature: 6.0
  #   msteps: 1
  #   forget_refresh_steps: 1
  #   forget_refresh_every: 2
  #   forget_lr_multiplier: 0.08
  #   refresh_lr_multiplier: 0.02
  #   selection_weight: 2.2
  #   delta_selection_weight: 1.8
  #   min_selected_vr: 0.86
  #   min_forget_drop: 0.003
  #   max_retain_drop: 0.04

  # method: "fine_tune"
  # checkpoint_path: "/content/gdrive/My Drive/mia_checkpoints/finetune_unlearned_model.pt"
  # params:
  #   lr: 0.00005
  #   unlearn_epochs: 5
  #   with_l1: true
  #   alpha: 0.00005
  #   no_l1_epochs: 2

  # method: "grad_ascent"
  # checkpoint_path: "/content/gdrive/My Drive/mia_checkpoints/grad_ascent_unlearned_model.pt"
  # params:
  #   # Third-party FT baseline options: gradient_ascent, gradient_ascent_descent, gradient_ascent_kl
  #   unlearn_method: "gradient_ascent_descent"
  #   num_epochs: 3
  #   lr: 0.00005
  #   train_batch_size: 32
  #   eval_batch_size: 32

mia:
  attacks:
    - name: "yeom"
      params:
        batch_size: 128

    - name: "shokri"
      params:
        num_shadow_models: 10
        epochs: 50

    - name: "lira"
      params:
        num_shadow_models: 16

    - name: "calibration"
      params:
        num_shadow_models: 4
        num_shadow_epochs: 20
        batch_size: 128
        lr: 0.01

    - name: "reference"
      params:
        num_shadow_models: 29

    - name: "augmentation"
      params:
        batch_size: 64
        num_augmentations: 2

output:
  save_dir: "./results/mia_disparity"
  log_dir: "./logs"
