experiment:
  name: "mia_disparity_cifar10"
  seed: 42
  device: "cuda"

dataset:
  name: "cifar10"
  data_root: "./data"
  split_dir: "./data/splits"
  forget_fraction: 0.2
  retain_fraction: 0.8
  num_classes: 10

model:
  architecture: "resnet18"
  pretrained: false
  checkpoint_path: "./checkpoints/full_model.pt"

unlearning:
  method: "scrub"   # [fine_tune, grad_ascent, scrub, ssd]
  checkpoint_path: "/content/gdrive/My Drive/mia_checkpoints/scrub_unlearned_model.pt"
  params:
    epochs: 20
    lr: 0.001
    weight_decay: 0.0001
    temperature: 6.0
    dampening_factor: 1.0

mia:
  attacks:
    - name: "yeom"
      params:
        batch_size: 128

    - name: "shokri"
      params:
        num_shadow_models: 10
        epochs: 50

    - name: "lira"
      params:
        num_shadow_models: 16

    - name: "reference"
      params:
        num_shadow_models: 29

    - name: "augmentation"
      params:
        batch_size: 64
        num_augmentations: 10

output:
  save_dir: "./results/mia_disparity"
  log_dir: "./logs"
