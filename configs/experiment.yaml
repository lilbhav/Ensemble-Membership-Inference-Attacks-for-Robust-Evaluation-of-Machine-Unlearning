paths:
  machine_unlearning_repo: Third_Party_Code/MachineUnlearning
  mia_disparity_repo: Third_Party_Code/mia-disparity
  data_root: /content/drive/MyDrive/unlearning_runs/data
  results_root: /content/drive/MyDrive/unlearning_runs/results

experiment:
  datasets: [Cifar10, Cifar100]
  base_model: ResNet18
  base_seeds: [0]
  device: cuda

split:
  split_mode: targeted_random
  target_class: 0
  forget_fraction: 0.1  # Fraction within the selected target_class, not the full training set.
  forget_count: null

training:
  baseline:
    epochs: 30
    batch_size: 128
    lr: 0.0001
    optimizer: adam
    momentum: 0.5
  unlearning:
    epochs: 1
    batch_size: 128
    lr: 0.0001
    optimizer: adam
    momentum: 0.5

unlearning:
  methods: [scrub, ssd, bad_teacher, amnesiac]

mia:
  attacks: [yeom, shokri, lira, reference, losstraj, calibration, aug]
  attack_seeds: [0]
  attack_epochs: 100
  batch_size: 256
  targets: [forget_vs_test, retain_vs_test, forget_vs_retain]

ensemble:
  voting_rules:
    or: true
    k_of_m: [2, 3]
  positive_label_threshold: 0.5
