# Local CIFAR-100 experiment config for the full unlearning + MIA pipeline.

paths:
  # Third-party engines invoked by bridge scripts.
  machine_unlearning_repo: Third_Party_Code/MachineUnlearning
  mia_disparity_repo: Third_Party_Code/mia-disparity

  # Use repository-local folders for Windows/local runs.
  data_root: /content/drive/MyDrive/unlearning_runs/data
  results_root: /content/drive/MyDrive/unlearning_runs/results

experiment:
  datasets: [Cifar100]
  base_model: ResNet18
  # Run one seed at a time with --seed, or omit the flag to run all three.
  base_seeds: [0, 1, 2]
  device: cuda

split:
  # Supported value: targeted_random
  split_mode: targeted_random

  # Forget examples are sampled only from this class.
  target_class: 0

  # On CIFAR-100, each class has 500 training images.
  # forget_count=250 matches the existing half-class sanity setup.
  forget_fraction: null
  forget_count: 250

training:
  baseline:
    # CIFAR-100 benefits from a longer schedule and stronger regularization
    # than the CIFAR-10 baseline used elsewhere in the repo.
    epochs: 180
    batch_size: 128
    lr: 0.05
    optimizer: sgd
    momentum: 0.9
    weight_decay: 0.001
    lr_scheduler: cosine
    train_augment: true
    label_smoothing: 0.1

  unlearning:
    epochs: 1
    batch_size: 64
    lr: 0.0001
    optimizer: adam
    momentum: 0.5

    scrub_sweep:
      - name: scrub_default
      - name: scrub_stronger_forgetting
        epochs: 10
        lr: 0.0005
        distill_weight: 0.05
        forget_loss_weight: 0.7
        maximize_epochs: 4
        maximize_steps: 2
        minimize_steps: 1
      - name: scrub_balanced
        epochs: 8
        lr: 0.0004
        distill_weight: 0.08
        forget_loss_weight: 0.5
        maximize_epochs: 3
        maximize_steps: 2
        minimize_steps: 2

    methods:
      scrub:
        # teacher_loaded: teacher = frozen baseline. The maximize phase pushes
        # the student away from teacher's predictions on forget data.
        # Pre-corruption is needed because teacher == student at epoch 1
        # → KL = 0 → zero gradient. pre_corrupt_epochs seeds non-zero KL first.
        mode: teacher_loaded
        # Gradient ascent on CE loss on forget set before SCRUB is called.
        pre_corrupt_epochs: 1
        pre_corrupt_lr: 0.0002
        retain_subset_size: 5000
        epochs: 12
        lr: 0.0008
        gamma: 0.995
        distill_weight: 0.05
        forget_loss_weight: 1.0
        maximize_epochs: 4
        maximize_steps: 1
        minimize_steps: 2
        post_maximize_repair_scale: 0.5
        kd_temperature: 4.0
        weight_decay: 0
        momentum: 0.9
        lr_decay_epochs: [8, 10]
        lr_decay_rate: 0.3
        post_repair_epochs: 2
        post_repair_lr: 0.0001
        post_repair_optimizer: sgd
        post_repair_batch_size: 128

      ssd:
        selection_weighting: 20
        dampening_constant: 10
        lower_bound: 1
        exponent: 1
        min_layer: -1
        max_layer: -1
        forget_threshold: 1
        # Keep disabled initially; turn on if SSD utility drops too hard on CIFAR-100.
        post_repair_epochs: 0

      bad_teacher:
        epochs: 30
        kl_temperature: 5.0
        retain_subset_fraction: 0.25

      amnesiac:
        # Best from 4-run grid sweep on seed 0:
        # forget_acc=4.73, test_acc=70.58, utility_drop=7.52 (baseline 78.11)
        epochs: 8
        optimizer: adam
        batch_size: 64

unlearning:
  methods: [amnesiac, bad_teacher, scrub, ssd]

mia:
  attacks: [yeom, shokri, lira, reference, losstraj, calibration, aug]
  attack_seeds: [0]
  attack_epochs: 20
  target_fpr: 0.05
  num_shadow_models: 5
  batch_size: 256
  targets: [forget_vs_test]

ensemble:
  voting_rules:
    or: true
    k_of_m: [2, 3]
  positive_label_threshold: 0.5
