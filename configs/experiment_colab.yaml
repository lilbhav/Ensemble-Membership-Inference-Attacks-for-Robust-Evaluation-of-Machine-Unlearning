paths:
	machine_unlearning_repo: /content/Ensemble-Membership-Inference-Attacks-for-Robust-Evaluation-of-Machine-Unlearning/Third_Party_Code/MachineUnlearning
	mia_disparity_repo: /content/Ensemble-Membership-Inference-Attacks-for-Robust-Evaluation-of-Machine-Unlearning/Third_Party_Code/mia-disparity
	data_root: /content/drive/MyDrive/unlearning_runs/data
	results_root: /content/drive/MyDrive/unlearning_runs/results

experiment:
	datasets: [Cifar10]
	base_model: ResNet18
	base_seeds: [0]
	device: cuda

split:
	forget_fraction: 0.1
	aux_fraction: 0.2
	test_fraction: 1.0
	stratified_by_label: true

training:
	baseline:
		epochs: 30
		batch_size: 128
		lr: 0.0001
		optimizer: adam
		momentum: 0.5
	unlearning:
		epochs: 1
		batch_size: 128
		lr: 0.0001
		optimizer: adam
		momentum: 0.5

unlearning:
	methods: [scrub]

mia:
	attacks: [yeom]
	attack_seeds: [0]
	attack_epochs: 100
	batch_size: 256
	targets: [forget_vs_test]

ensemble:
	voting_rules:
		or: true
		k_of_m: [2, 3]
	positive_label_threshold: 0.5
