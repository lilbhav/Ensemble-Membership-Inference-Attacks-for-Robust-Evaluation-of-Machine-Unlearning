dataset: cifar10
dataroot: /content/data/raw
forget_fraction: 0.2
seed: 42
split_dir: /content/gdrive/My Drive/mia_splits/ssd_targeted_random
batch_size: 128
num_workers: 2
pin_memory: true

# Transfer setup: pretrain on CIFAR-100, replace final layer, fine-tune on CIFAR-10.
source_checkpoint_cifar100: /content/gdrive/My Drive/mia_checkpoints/pretrained_cifar100.pt
model_path: /content/gdrive/My Drive/mia_checkpoints/finetuned_cifar10_from_cifar100.pt
transfer_finetune_epochs: 10
transfer_finetune_batch_size: 128
transfer_finetune_learning_rate: 0.001
rebuild_transfer_checkpoint: false

# Targeted random split setup (random samples, not per-class quotas).
forget_class: 0
retain_count: 900
forget_count: 25
left_out_count: 225

check_path: /content/gdrive/My Drive/mia_checkpoints/ssd_unlearned_model.pt
results_path: /content/gdrive/My Drive/mia_checkpoints/ssd_results.txt
learning_rate: 0.1

# SSD parameters.
# selection_weighting (alpha): parameter selected only if forget_importance > alpha * retain_importance.
#   Higher = fewer parameters touched = safer for retain accuracy.
#   SSD paper used alpha=10 for full-class forgetting (~5000 samples). With only 25 forget
#   samples the Fisher estimate is noisy, so a higher threshold is needed.
# dampening_constant (lambda): dampening scale = (lambda * retain_imp / forget_imp)^exponent.
#   Lower = less aggressive dampening.
lower_bound: 1.0
exponent: 1.0
forget_threshold: 1.0
min_layer: -1
max_layer: -1
dampening_constant: 1
selection_weighting: 10

eval_every: 1
print_accuracies: true
device: null
