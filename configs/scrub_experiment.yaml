# SCRUB Unlearning Experiment Configuration (Retain-Optimized)

# Training parameters
epochs: 15
learning_rate: 0.003
batch_size: 256
weight_decay: 0.0001

# Knowledge Distillation / SCRUB parameters
kd_T: 8.0        # Higher temperature = smoother targets = better retention
msteps: 4        # Fewer forget steps = less collateral damage
t_opt_gamma: 0.7 # More weight on classification loss
t_opt_alpha: 1.2 # Less aggressive forgetting

# Data parameters
dataset: cifar10
dataroot: ./data/raw
forget_fraction: 0.1
seed: 42

# Checkpoint and logging
check_path: ./results/scrub_unlearned_model.pt
print_accuracies: true

# Evaluation parameters
eval_every: 1
max_train_samples: null
max_eval_samples: null
sample_fraction: null

# Data loading parameters
num_workers: 4
pin_memory: true
