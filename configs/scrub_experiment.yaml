# Retain-optimized SCRUB config

epochs: 20
learning_rate: 0.001
batch_size: 256
weight_decay: 0.0001

kd_T: 6.0
msteps: 5
t_opt_gamma: 1.0
t_opt_alpha: 1.0

dataset: cifar10
dataroot: ./data/raw
forget_fraction: 0.2
seed: 42

check_path: ./results/scrub_unlearned_model/scrub_unlearned_model.pt
results_path: ./results/scrub_unlearned_model/results.txt
print_accuracies: true

eval_every: 1
num_workers: 2
pin_memory: true
