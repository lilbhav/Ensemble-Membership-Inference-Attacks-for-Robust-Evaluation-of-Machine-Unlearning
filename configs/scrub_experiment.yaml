# SCRUB Unlearning Experiment Configuration - Retain-focused

epochs: 20
learning_rate: 0.005
batch_size: 256
weight_decay: 0.0001

# KD parameters
kd_T: 6.0
msteps: 6
t_opt_gamma: 0.4
t_opt_alpha: 2.0

# Data parameters
dataset: cifar10
dataroot: ./data/raw
forget_fraction: 0.1
seed: 42

# Checkpoint and logging
check_path: ./results/scrub_unlearned_model.pt
print_accuracies: true

# Evaluation parameters
eval_every: 1
max_train_samples: null
max_eval_samples: null
sample_fraction: null

# Data loading parameters
num_workers: 4
pin_memory: true
