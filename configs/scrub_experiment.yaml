# Retain-optimized SCRUB config

epochs: 10
learning_rate: 0.0005
batch_size: 128
weight_decay: 0.0005

kd_T: 6.0
msteps: 3
forget_refresh_steps: 1
forget_refresh_every: 2
forget_lr_multiplier: 0.2
refresh_lr_multiplier: 0.03
max_forget_loss_magnitude: 10000.0
t_opt_gamma: 1.0
t_opt_alpha: 1.0

dataset: cifar10
dataroot: ./data/raw
model_path: /content/gdrive/My Drive/mia_checkpoints/pretrained_cifar10.pt
forget_fraction: 0.2
seed: 42
split_dir: ./data/splits
selection_weight: 1.2
min_selected_vr: 0.88

check_path: /content/gdrive/My Drive/mia_checkpoints/scrub_unlearned_model.pt
results_path: ./results/scrub_unlearned_model/results.txt
print_accuracies: true

eval_every: 1
num_workers: 2
pin_memory: true
