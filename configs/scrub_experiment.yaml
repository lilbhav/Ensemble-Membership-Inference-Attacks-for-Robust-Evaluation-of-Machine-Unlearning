# Retain-optimized SCRUB config

epochs: 15
learning_rate: 0.001
batch_size: 256
weight_decay: 0.0001

kd_T: 4.0
msteps: 1
t_opt_gamma: 0.5
t_opt_alpha: 0.5

dataset: cifar10
dataroot: ./data/raw
forget_fraction: 0.1
seed: 42

check_path: ./results/scrub_unlearned_model.pt
print_accuracies: true

eval_every: 1
num_workers: 2
pin_memory: true
