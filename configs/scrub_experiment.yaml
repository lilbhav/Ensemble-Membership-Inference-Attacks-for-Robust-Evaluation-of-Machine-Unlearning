dataset: cifar10
dataroot: /content/data/raw
seed: 42
split_dir: /content/gdrive/My Drive/mia_splits/scrub_targeted_random

# Transfer setup: pretrain on CIFAR-100, replace final layer, fine-tune on CIFAR-10.
source_checkpoint_cifar100: /content/gdrive/My Drive/mia_checkpoints/pretrained_cifar100.pt
model_path: /content/gdrive/My Drive/mia_checkpoints/finetuned_cifar10_from_cifar100.pt
transfer_finetune_epochs: 10
transfer_finetune_batch_size: 128
transfer_finetune_learning_rate: 0.001
rebuild_transfer_checkpoint: false

# Targeted-random split setup: forget samples from one class only.
# Retain: 100 samples/class x 9 non-forget classes = 900
# Left-out: 25 samples/class x 9 non-forget classes = 225
split_protocol: "targeted_random"
forget_class: 3  # 0=airplane 1=automobile 2=bird 3=cat 4=deer 5=dog 6=frog 7=horse 8=ship 9=truck
retain_count: 900
forget_count: 100
left_out_count: 225

check_path: /content/gdrive/My Drive/mia_checkpoints/scrub_unlearned_model.pt
results_path: /content/gdrive/My Drive/mia_checkpoints/scrub_results.txt
print_accuracies: true
unlearn_epochs: 2

batch_size: 128
num_workers: 2
pin_memory: true
eval_every: 1

# SCRUB hyperparameters
optim: sgd
gamma: 1
alpha: 0.4
beta: 0.4
smoothing: 0.0
msteps: 2
clip: 0.2
sstart: 10
kd_T: 1
distill: kd
sgda_batch_size: 64
del_batch_size: 64
sgda_epochs: 4
sgda_learning_rate: 0.0005
lr_decay_epochs: []
lr_decay_rate: 0
sgda_weight_decay: 0
sgda_momentum: 0.9

# Wrapper-level guardrailed checkpoint selection.
# Keep utility close to baseline while requiring meaningful forget-drop.
selection_delta: 0.08
max_valid_retain_acc_drop: 0.10
max_test_acc_drop: 0.10
min_valid_forget_acc_drop: 0.10
min_train_forget_acc_drop: 0.10
