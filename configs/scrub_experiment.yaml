# Retain-optimized SCRUB config

epochs: 15
learning_rate: 0.005
batch_size: 256
weight_decay: 0.0001

kd_T: 8.0
msteps: 4
t_opt_gamma: 0.7
t_opt_alpha: 1.0

dataset: cifar10
dataroot: ./data/raw
forget_fraction: 0.1
seed: 42

check_path: ./results/scrub_unlearned_model.pt
print_accuracies: true

eval_every: 1
num_workers: 2
pin_memory: true
